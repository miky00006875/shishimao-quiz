  .re-btn{

/* ===================== 工具 ===================== */
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*(1+p/100))));
  g=Math.max(0,Math.min(255,Math.round(g*(1+p/100))));
  b=Math.max(0,Math.min(255,Math.round(b*(1+p/100))));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function catSVG(ip,scale){
  scale=scale||1;
  const c=ip.color, ear=shade(c,-18), leaf="#7CC576";
  let eyes="";
  const e=ip.eye;
  if(e==="happy"){eyes='<path d="M33 56 q6 -7 12 0" stroke="#5A4636" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M55 56 q6 -7 12 0" stroke="#5A4636" stroke-width="3.2" fill="none" stroke-linecap="round"/>';}
  else if(e==="big"){eyes='<circle cx="39" cy="56" r="5.5" fill="#5A4636"/><circle cx="61" cy="56" r="5.5" fill="#5A4636"/><circle cx="41" cy="54" r="1.8" fill="#fff"/><circle cx="63" cy="54" r="1.8" fill="#fff"/>';}
  else if(e==="grumpy"){eyes='<circle cx="39" cy="57" r="4.5" fill="#5A4636"/><circle cx="61" cy="57" r="4.5" fill="#5A4636"/><path d="M30 48 l14 5" stroke="#5A4636" stroke-width="3" stroke-linecap="round"/><path d="M70 48 l-14 5" stroke="#5A4636" stroke-width="3" stroke-linecap="round"/>';}
  else if(e==="sleepy"){eyes='<path d="M32 57 q7 5 14 0" stroke="#5A4636" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M54 57 q7 5 14 0" stroke="#5A4636" stroke-width="3" fill="none" stroke-linecap="round"/>';}
  else if(e==="wink"){eyes='<path d="M33 56 q6 -7 12 0" stroke="#5A4636" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="61" cy="56" r="4.5" fill="#5A4636"/>';}
  return '<svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg" width="'+(72*scale)+'" height="'+(80*scale)+'">'+
    '<path d="M22 40 L16 12 L44 32 Z" fill="'+ear+'"/>'+
    '<path d="M78 40 L84 12 L56 32 Z" fill="'+ear+'"/>'+
    '<path d="M26 36 L23 22 L37 31 Z" fill="#FFD1DC"/>'+
    '<path d="M74 36 L77 22 L63 31 Z" fill="#FFD1DC"/>'+
    '<circle cx="50" cy="60" r="35" fill="'+c+'"/>'+
    '<path d="M50 27 q9 -12 18 -7 q-7 9 -18 7 Z" fill="'+leaf+'"/>'+
    eyes+
    '<ellipse cx="31" cy="66" rx="6.5" ry="4.2" fill="#FF9EB5" opacity=".75"/>'+
    '<ellipse cx="69" cy="66" rx="6.5" ry="4.2" fill="#FF9EB5" opacity=".75"/>'+
    '<path d="M50 62 l-3.5 4 h7 Z" fill="#FF7A8A"/>'+
    '<path d="M50 66 q-6 6 -12 2 M50 66 q6 6 12 2" stroke="#5A4636" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
    '<path d="M14 60 h12 M14 66 h12 M86 60 h-12 M86 66 h-12" stroke="'+shade(c,-30)+'" stroke-width="1.6" stroke-linecap="round"/>'+
    '</svg>';
}

/* ===================== 渲染 ===================== */
const $=s=>document.querySelector(s);
const collage=$("#collage");
IP_ORDER.forEach(name=>{
  const ip=IPS[name];
  const d=document.createElement("div");
  d.className="thumb";
  d.innerHTML=catSVG(ip,0.92)+'<span>'+ip.emoji+' '+name+'</span>';
  collage.appendChild(d);
});

let cur=0; const answers=new Array(QUESTIONS.length).fill(-1);

function renderQ(){
  const Q=QUESTIONS[cur];
  $("#qnum").textContent="Q"+(cur+1);
  $("#qtext").textContent=Q.q;
  $("#progtxt").textContent="第"+(cur+1)+"/"+QUESTIONS.length+"题";
  $("#progfill").style.width=((cur+1)/QUESTIONS.length*100)+"%";
  const box=$("#opts"); box.innerHTML="";
  const labels=["A","B","C","D"];
  Q.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt"+(answers[cur]===i?" sel":"");
    b.innerHTML='<span class="lab">'+labels[i]+'</span><span class="txt">'+o.t+'</span>';
    b.onclick=()=>{answers[cur]=i; renderQ(); setTimeout(next,180);};
    box.appendChild(b);
  });
  $("#backBtn").style.visibility=cur===0?"hidden":"visible";
}
function next(){
  if(cur<QUESTIONS.length-1){cur++;renderQ();}
  else showResult();
}
$("#backBtn").onclick=()=>{if(cur>0){cur--;renderQ();}};
$("#startBtn").onclick=()=>{cur=0;renderQ();showScreen("quiz");};

function compute(){
  const score={};
  answers.forEach((ai,qi)=>{
    if(ai<0)return;
    QUESTIONS[qi].opts[ai].ips.forEach(ip=>score[ip]=(score[ip]||0)+1);
  });
  let best=null,bs=-1;
  IP_ORDER.forEach(name=>{
    const s=score[name]||0;
    if(s>bs){bs=s;best=name;}
  });
  return best||"好柿降临";
}
function showResult(){
  const name=compute();
  const ip=IPS[name];
  const poster=$("#poster");
  poster.style.background="linear-gradient(160deg,"+ip.color+","+shade(ip.color,-22)+")";
  poster.innerHTML=
    '<div class="ptag">🍅 你的专属柿柿猫是 🐱</div>'+
    '<div class="pemoji">'+ip.emoji+'</div>'+
    '<div class="pname">'+ip.emoji+' '+name+'</div>'+
    '<div class="pslogan">「'+ip.slogan+'」</div>'+
    '<div class="pdesc">'+ip.desc+'</div>'+
    '<div class="pcta">去同款IP超话找组织 👉 #柿柿猫#</div>';
  showScreen("result");
  burstHearts();
}
$("#reBtn").onclick=()=>{answers.fill(-1);cur=0;renderQ();showScreen("quiz");};

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#"+id).classList.add("active");
  window.scrollTo(0,0);
}
function burstHearts(){
  const box=$("#hearts");box.innerHTML="";
  const emo=["🍅","💕","🐱","✨","🍓","🍎"];
  for(let i=0;i<24;i++){
    const h=document.createElement("div");
    h.className="heart";h.textContent=emo[Math.floor(Math.random()*emo.length)];
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(14+Math.random()*16)+"px";
    h.style.animationDuration=(2.5+Math.random()*2.5)+"s";
    h.style.animationDelay=(Math.random()*1.2)+"s";
    box.appendChild(h);
  }
  setTimeout(()=>box.innerHTML="",5200);
}
</script>
</body>
</html>
